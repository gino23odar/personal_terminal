name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify PTY test prerequisite
        run: python3 --version
      - name: Native, PTY and portable WASM checks
        run: bash scripts/check-rust.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and WASM build tooling
        run: |
          rustup show
          cargo install wasm-pack --version 0.15.1 --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web:browser
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned pnpm and wasm-pack
        run: |
          npm install --global pnpm@11.25.0
          cargo install wasm-pack --version 0.15.1 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build WASM and test generated JS in Node and Chromium
        run: pnpm check:wasm
